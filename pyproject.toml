[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funkyconf"
version = "0.1.0"
description = "A composable, immutable DSL for building YAML/JSON configs as pure-function compositions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["configuration", "yaml", "json", "dsl", "immutable", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]

dependencies = []   # zero hard deps — PyYAML is optional

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev  = ["pyyaml>=6.0", "pytest>=8.0", "pytest-cov"]

[project.urls]
Homepage   = "https://github.com/AndreGoros/funkyconf"
Repository = "https://github.com/AndreGoros/funkyconf"
Issues     = "https://github.com/AndreGoros/funkyconf/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["funkyconf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["funkyconf"]
branch = true

[tool.coverage.report]
show_missing = true
